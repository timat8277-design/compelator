name: Build ExteraChimera Tweak for iOS (ESign)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Компиляция ExteraChimeraTweak.dylib
        run: |
          TWEAK_PATH=$(find . -name "ExteraChimeraTweak.m" | head -n 1)
          echo "[+] Найден файл твика: $TWEAK_PATH"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -Wno-everything \
            -undefined dynamic_lookup \
            -framework Foundation -framework UIKit -lobjc \
            "$TWEAK_PATH" \
            -o ExteraChimeraTweak.dylib

          echo "=== УСПЕХ: ExteraChimeraTweak.dylib скомпилирован! ==="
          file ExteraChimeraTweak.dylib
          ls -la ExteraChimeraTweak.dylib

      - name: Выгрузка готового ExteraChimeraTweak.dylib для ESign
        uses: actions/upload-artifact@v4
        with:
          name: ExteraChimeraTweak-dylib-for-ESign
          path: ExteraChimeraTweak.dylib
          retention-days: 14
